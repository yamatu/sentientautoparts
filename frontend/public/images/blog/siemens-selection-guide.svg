<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Siemens automation parts selection guide</title>
  <desc id="desc">A technical illustration of a SIMATIC PLC and SINAMICS drive selection workflow.</desc>
